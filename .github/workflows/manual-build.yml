name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择要编译的平台'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - windows
        - linux
        - macos

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: Windows-x86_64
            platform: windows
            archive_name: bili-sync-rs-Windows-x86_64.zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: Linux-x86_64-musl
            platform: linux
            archive_name: bili-sync-rs-Linux-x86_64-musl.tar.gz
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            name: Linux-armv7-musl
            platform: linux
            archive_name: bili-sync-rs-Linux-armv7-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: Linux-aarch64-musl
            platform: linux
            archive_name: bili-sync-rs-Linux-aarch64-musl.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: Darwin-x86_64
            platform: macos
            archive_name: bili-sync-rs-Darwin-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: Darwin-aarch64
            platform: macos
            archive_name: bili-sync-rs-Darwin-aarch64.tar.gz
        exclude:
          - platform: ${{ github.event.inputs.platforms == 'windows' && 'linux' || 'exclude-none' }}
          - platform: ${{ github.event.inputs.platforms == 'windows' && 'macos' || 'exclude-none' }}
          - platform: ${{ github.event.inputs.platforms == 'linux' && 'windows' || 'exclude-none' }}
          - platform: ${{ github.event.inputs.platforms == 'linux' && 'macos' || 'exclude-none' }}
          - platform: ${{ github.event.inputs.platforms == 'macos' && 'windows' || 'exclude-none' }}
          - platform: ${{ github.event.inputs.platforms == 'macos' && 'linux' || 'exclude-none' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build frontend
      run: |
        cd web
        npm ci
        npm run build

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2

    - name: Install cross (Linux ARM)
      if: matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'armv7-unknown-linux-musleabihf'
      run: cargo install cross --git https://github.com/cross-rs/cross

    - name: Install musl (Linux x86_64)
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Build & Package (with/without bundled aria2)
      run: |
        set -euo pipefail

        mkdir -p release

        build_one() {
          local features="$1"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" || "${{ matrix.target }}" == "armv7-unknown-linux-musleabihf" ]]; then
            cross build --release --target ${{ matrix.target }} -p bili_sync --features "$features"
          else
            cargo build --release --target ${{ matrix.target }} -p bili_sync --features "$features"
          fi
        }

        if [ "${{ runner.os }}" = "Windows" ]; then
          bin_src="target/${{ matrix.target }}/release/bili-sync-rs.exe"
          bin_plain="release/bili-sync-rs.exe"
          bin_bundled="release/bili-sync-rs-bundled-aria2.exe"
        else
          bin_src="target/${{ matrix.target }}/release/bili-sync-rs"
          bin_plain="release/bili-sync-rs"
          bin_bundled="release/bili-sync-rs-bundled-aria2"
        fi

        echo "==> Build aria2 (no bundled)"
        build_one "aria2"
        cp "$bin_src" "$bin_plain"

        echo "==> Build bundled-aria2"
        build_one "bundled-aria2"
        cp "$bin_src" "$bin_bundled"

        cd release
        bundled_archive_name="${{ matrix.archive_name }}"
        case "$bundled_archive_name" in
          *.tar.gz) bundled_archive_name="${bundled_archive_name%.tar.gz}-bundled-aria2.tar.gz" ;;
          *.zip) bundled_archive_name="${bundled_archive_name%.zip}-bundled-aria2.zip" ;;
        esac

        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a ${{ matrix.archive_name }} bili-sync-rs.exe
          7z a "$bundled_archive_name" bili-sync-rs-bundled-aria2.exe
        else
          tar -czf ${{ matrix.archive_name }} bili-sync-rs
          tar -czf "$bundled_archive_name" bili-sync-rs-bundled-aria2
        fi
      shell: bash

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}
        path: release/${{ matrix.archive_name }} 

    - name: Upload bundled-aria2 package (zip)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}-bundled-aria2
        path: release/*-bundled-aria2.zip

    - name: Upload bundled-aria2 package (tar.gz)
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.archive_name }}-bundled-aria2
        path: release/*-bundled-aria2.tar.gz
