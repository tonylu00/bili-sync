name: Verify library and shared media

on:
  push:
    branches: [main, master, 'feat*', 'fix*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: shared-media-tests
      - name: Validate frontend
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Test library migration, storage, filters, and identities
        run: cargo test --locked -p bili_sync --bin bili-sync-rs
